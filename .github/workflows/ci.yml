name: Build and test

on:
  push:
  pull_request:

jobs:
  web-and-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository documentation
        run: npm run verify:repo
      - name: Build standalone PWA
        run: npm run build
      - name: Run fast regressions
        run: npm test
      - name: Test native C++ core
        run: npm run test:cpp
      - name: Run full Nizhny regression
        run: npm run test:simulation
      - name: Run full Izmir regression
        run: npm run test:izmir
